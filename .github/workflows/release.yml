name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag (e.g. 1.3.6 or v1.3.6). Leave empty to use pubspec.yaml version."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      build_name: ${{ steps.v.outputs.build_name }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [ "$EVENT" = "push" ]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '\r[:space:]')
            VERSION="${VERSION%%+*}"
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi

          BUILD_NAME="${VERSION%%-*}"   # iOS needs plain x.y.z
          case "$VERSION" in *-*) PRE=true;; *) PRE=false;; esac

          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_name=$BUILD_NAME" >> $GITHUB_OUTPUT
          echo "prerelease=$PRE" >> $GITHUB_OUTPUT
          echo "Resolved: v$VERSION (build name $BUILD_NAME)"

  build-android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          ANDROID_GOOGLE_CLIENT_ID: ${{ secrets.ANDROID_GOOGLE_CLIENT_ID }}
          IOS_GOOGLE_CLIENT_ID: ${{ secrets.IOS_GOOGLE_CLIENT_ID }}
          WEB_GOOGLE_CLIENT_ID: ${{ secrets.WEB_GOOGLE_CLIENT_ID }}
          WEB_GOOGLE_CLIENT_ID_SECRET: ${{ secrets.WEB_GOOGLE_CLIENT_ID_SECRET }}
          # GITHUB_* names are reserved, so pass under other names
          # and write them to .env as GITHUB_USERNAME / GITHUB_REPOSITORY.
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          {
            printf 'SERVER_URL=%s\n' "$SERVER_URL"
            printf 'ANDROID_GOOGLE_CLIENT_ID=%s\n' "$ANDROID_GOOGLE_CLIENT_ID"
            printf 'IOS_GOOGLE_CLIENT_ID=%s\n' "$IOS_GOOGLE_CLIENT_ID"
            printf 'WEB_GOOGLE_CLIENT_ID=%s\n' "$WEB_GOOGLE_CLIENT_ID"
            printf 'WEB_GOOGLE_CLIENT_ID_SECRET=%s\n' "$WEB_GOOGLE_CLIENT_ID_SECRET"
            printf 'GITHUB_USERNAME=%s\n' "$REPO_OWNER"
            printf 'GITHUB_REPOSITORY=%s\n' "$REPO_NAME"
            printf 'MODE=production\n'
          } > .env

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --build-name=${{ needs.version.outputs.build_name }} --build-number=${{ github.run_number }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/app-${{ needs.version.outputs.tag }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  build-ios:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          ANDROID_GOOGLE_CLIENT_ID: ${{ secrets.ANDROID_GOOGLE_CLIENT_ID }}
          IOS_GOOGLE_CLIENT_ID: ${{ secrets.IOS_GOOGLE_CLIENT_ID }}
          WEB_GOOGLE_CLIENT_ID: ${{ secrets.WEB_GOOGLE_CLIENT_ID }}
          WEB_GOOGLE_CLIENT_ID_SECRET: ${{ secrets.WEB_GOOGLE_CLIENT_ID_SECRET }}
        run: |
          {
            printf 'SERVER_URL=%s\n' "$SERVER_URL"
            printf 'ANDROID_GOOGLE_CLIENT_ID=%s\n' "$ANDROID_GOOGLE_CLIENT_ID"
            printf 'IOS_GOOGLE_CLIENT_ID=%s\n' "$IOS_GOOGLE_CLIENT_ID"
            printf 'WEB_GOOGLE_CLIENT_ID=%s\n' "$WEB_GOOGLE_CLIENT_ID"
            printf 'WEB_GOOGLE_CLIENT_ID_SECRET=%s\n' "$WEB_GOOGLE_CLIENT_ID_SECRET"
            printf 'MODE=production\n'
          } > .env

      - run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --build-name=${{ needs.version.outputs.build_name }} --build-number=${{ github.run_number }}

      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist
          zip -qr "app-${{ needs.version.outputs.tag }}.ipa" Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/*.ipa

  release:
    needs: [version, build-android, build-ios]
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.rel.outputs.url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        id: rel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: artifacts/*

  notify:
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord release message
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_URL: ${{ needs.release.outputs.url }}
        run: |
          NOTES=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body | cut -c1-1000)
          [ -z "$NOTES" ] && NOTES="No notes."

          case "$GITHUB_REPOSITORY" in
            *aris-app*) COLOR=16711680;;
            *aris-vista*) COLOR=65280;;
            *) COLOR=255;;
          esac

          JSON=$(jq -n \
            --arg title "New Release: $TAG" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg user "$GITHUB_ACTOR" \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg url "$RELEASE_URL" \
            --arg time "$(date -u)" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                color: $color,
                fields: [
                  { name: "Repository", value: $repo, inline: true },
                  { name: "User", value: $user, inline: true },
                  { name: "Version", value: $version, inline: true },
                  { name: "Release Notes", value: $notes, inline: false },
                  { name: "Release URL", value: $url, inline: false },
                  { name: "Time", value: $time, inline: false }
                ]
              }]
            }')

          curl -H "Content-Type: application/json" -d "$JSON" "$DISCORD_RELEASE_WEBHOOK"
